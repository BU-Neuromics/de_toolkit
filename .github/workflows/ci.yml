name: CI

on:
  push:
    branches: [ main, "phase*" ]
  pull_request:
    branches: [ main ]

# least privilege (CodeQL actions/missing-workflow-permissions): every job only
# checks out and reads the repository; artifacts and the uv cache use the
# runtime token, not GITHUB_TOKEN
permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: ruff check
        run: uv run --only-group dev ruff check .

      - name: ruff format check
        run: uv run --only-group dev ruff format --check .

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build docs
        run: uv run --group docs mkdocs build --strict

      # the tutorial markers and hidden blocks must not show on the site; this
      # test needs the docs group's Markdown, so it skips in the test jobs;
      # here it must run and pass, not skip
      - name: Tutorial markers do not render
        run: |
          set -o pipefail
          uv run --group docs --group dev pytest tests/tutorials/test_tutorial_runner.py \
            -o addopts="" -p no:cacheprovider -k site -rs | tee "$RUNNER_TEMP/site.txt"
          grep -q " 1 passed" "$RUNNER_TEMP/site.txt"
          if grep -q "skipped" "$RUNNER_TEMP/site.txt"; then exit 1; fi

  # statsmodels is test-only (DETK-0026): import every de_toolkit module and
  # run a detk command with only the runtime dependencies installed, so a
  # runtime use of a test-only package fails here instead of reaching users
  runtime-deps:
    name: runtime dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install the project without dev dependencies or extras
        run: uv sync --locked --no-dev

      - name: Import every module and run detk-norm
        run: uv run --locked --no-dev python tests/check_runtime_deps.py

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --dev

      # the report's DOM render tests (tests/report/test_report_view_text.py)
      # need node and jsdom; one matrix job installs the jsdom pinned in
      # tests/report/package-lock.json outside the tree and requires them
      # (DETK_REQUIRE_JSDOM below), the others skip them
      - name: Set up node (report render tests)
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jsdom (report render tests)
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p "$RUNNER_TEMP/jsdom"
          cp tests/report/package.json tests/report/package-lock.json "$RUNNER_TEMP/jsdom/"
          npm ci --prefix "$RUNNER_TEMP/jsdom"
          echo "NODE_PATH=$RUNNER_TEMP/jsdom/node_modules" >> "$GITHUB_ENV"

      # R and Bioconductor are not installed in this job, so the R-backed tests
      # (DESeq2, fgsea, logistf) skip automatically. The test-r job below
      # exercises the R integration.
      - name: Run non-R test suite
        env:
          # unique, combinable data file per matrix job (picked up by the
          # coverage job below via `coverage combine`)
          COVERAGE_FILE: .coverage.py${{ matrix.python-version }}
          # a missing node or jsdom fails the report render tests here
          DETK_REQUIRE_JSDOM: ${{ matrix.python-version == '3.13' && '1' || '' }}
        run: |
          uv run pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing

      # list each render test by name, so the log shows every one ran and passed;
      # pass or fail is read from pytest's final summary line alone (the -v
      # listing prints test names, which may hold 'error' or 'failed'): it must
      # count passed tests and no failed, error, skipped, xfailed or xpassed ones
      - name: Report render tests ran in jsdom
        if: matrix.python-version == '3.13'
        env:
          DETK_REQUIRE_JSDOM: "1"
        run: |
          set -o pipefail
          uv run pytest tests/report/test_report_view_text.py -o addopts="" \
            -p no:cacheprovider -v -rs | tee "$RUNNER_TEMP/jsdom.txt"
          tail -n 1 "$RUNNER_TEMP/jsdom.txt" | awk '{ print "pytest summary: " $0 } /[0-9]+ passed/ && !/[0-9]+ (failed|errors?|skipped|xfailed|xpassed)/ { ok = 1 } END { exit !ok }'

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: .coverage.py${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  test-r:
    name: test with R (bioconda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install R + Bioconductor packages as prebuilt bioconda binaries, which
      # is far faster than compiling DESeq2/fgsea from source.
      - name: Set up micromamba with R packages
        uses: mamba-org/setup-micromamba@v2
        with:
          condarc: |
            channels:
              - conda-forge
              - bioconda
          environment-name: detk-r
          create-args: >-
            python=3.12
            r-base
            r-jsonlite
            r-data.table
            bioconductor-deseq2
            bioconductor-fgsea
            bioconductor-airway
            bioconductor-org.hs.eg.db
            r-logistf
            miller

      # uv only exports the lock here; pip installs it into the micromamba
      # environment's Python, so the R tests run on the versions uv.lock pins
      # (the same set the uv jobs above sync), not on whatever PyPI has today.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install package and test dependencies from uv.lock
        shell: bash -el {0}
        run: |
          uv export --frozen --group dev --no-hashes --no-emit-project \
            > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements.txt"
          python -m pip install --no-deps -e .
          python -m pip check
          python -c 'import sys, numpy, pandas, matplotlib; print("python", sys.version.split()[0]); print("numpy", numpy.__version__); print("pandas", pandas.__version__); print("matplotlib", matplotlib.__version__)'

      # DETK_TUTORIALS_REQUIRE_ALL: a tutorial page whose requirements (R
      # packages, Miller) are missing fails here instead of skipping, so this
      # job runs every tutorial (docs/dev/tutorials.md)
      - name: Run full test suite (including R and every tutorial)
        shell: bash -el {0}
        env:
          COVERAGE_FILE: .coverage.r
          DETK_TUTORIALS_REQUIRE_ALL: "1"
        run: |
          Rscript --version
          mlr --version
          pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-r
          path: .coverage.r
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: combined coverage
    runs-on: ubuntu-latest
    needs: [ test, test-r ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the combine job only needs the coverage CLI, not the project
      - name: Install coverage
        run: python -m pip install coverage

      - name: Download coverage data from all test jobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage across the matrix and R jobs
        run: |
          coverage combine coverage-data
          coverage report

      - name: Write coverage summary
        run: |
          TOTAL=$(coverage report --format=total)
          {
            echo "## Combined coverage: ${TOTAL}%"
            echo
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Floor: local non-R total measured at 71%, rounded down minus a
      # 2-point safety margin. The combined number (with the R job) is
      # higher — first combined run measured 89% (2026-08-11); floor set to 87.
      - name: Enforce coverage floor
        run: coverage report --fail-under=87
