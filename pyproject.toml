[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "de_toolkit"
description = "Suite of tools for working with count data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Adam Labadorf and the BU Bioinformatics Hub Team", email = "labadorf@bu.edu" },
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "docopt-ng",
    "jinja2",
    "numpy",
    "pandas",
    "patsy>=1.0",
    "ply",
    "scipy",
    "scikit-learn",
    "statsmodels>=0.14",
    "terminaltables",
]
keywords = ["bioinformatics", "biology", "sequencing", "NGS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/BU-Neuromics/de_toolkit"
Repository = "https://github.com/BU-Neuromics/de_toolkit"
Documentation = "https://bu-neuromics.github.io/de_toolkit/"

# kept for plain-pip users (`pip install -e '.[test]'`); uv users get the same
# packages via the dev dependency group below
[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[dependency-groups]
dev = [
    "jsonschema",
    "roc-validator",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    # mkdocs 2.0 is a backward-incompatible rewrite that Material does not
    # support; stay on the 1.x line Material is built against
    "mkdocs>=1.6,<2",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.scripts]
detk = "de_toolkit.common:main"
detk-norm = "de_toolkit.norm:main"
detk-de = "de_toolkit.de:main"
detk-enrich = "de_toolkit.enrich:main"
detk-transform = "de_toolkit.transform:main"
detk-filter = "de_toolkit.filter:main"
detk-stats = "de_toolkit.stats:main"
detk-outlier = "de_toolkit.outlier:main"
detk-wrapr = "de_toolkit.wrapr:main"
detk-report = "de_toolkit.report:main"
detk-util = "de_toolkit.util:main"

[tool.hatch.version]
path = "de_toolkit/version.py"

[tool.hatch.build.targets.wheel]
# hatchling ships every file under the package by default, which is what we
# want: templates/report.html and templates/vega/* must be in the wheel
# (asserted in tests/report/test_report_render.py)
packages = ["de_toolkit"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# conservative start: pyflakes/pycodestyle defaults plus modernization (UP)
# and likely-bug (B) rules; ratchet further rules in later, dedicated passes
select = ["E4", "E7", "E9", "F", "UP", "B"]
ignore = [
    # detk modules intentionally put the docopt usage string and cmd_opts
    # before imports; that idiom is load-bearing for the CLI
    "E402",
    # adding zip(..., strict=...) changes runtime behavior; handled case by
    # case rather than as a sweep
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# tests use star imports of the module under test and broad pytest.raises
"tests/*" = ["F403", "F405", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["de_toolkit"]
