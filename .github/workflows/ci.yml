name: CI

on:
  push:
    branches: [ main, "phase0-modernize" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      # R and Bioconductor are not installed in this job, so the R-backed tests
      # (DESeq2, fgsea, logistf) and the Snakemake report end-to-end test skip
      # automatically. A separate R-enabled job is planned (see ROADMAP Phase 1).
      - name: Run non-R test suite
        run: |
          pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing
