<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>detk report</title>
<style>
  :root {
    --bg:#ffffff; --panel:#f7f8fa; --tray:#f2f4f7; --border:#e3e6ea;
    --fg:#1c2733; --muted-solid:#5b6b7b; --accent:#3b6ea5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1419; --panel:#171d25; --tray:#12171e; --border:#263140;
      --fg:#e6edf3; --muted:#8896a5; --muted-solid:#8896a5; --accent:#6ea8e0;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1419; --panel:#171d25; --tray:#12171e; --border:#263140;
    --fg:#e6edf3; --muted:#8896a5; --muted-solid:#8896a5; --accent:#6ea8e0;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header {
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
    padding:14px 22px; background:var(--bg); border-bottom:1px solid var(--border);
  }
  header h1 { margin:0; font-size:18px; letter-spacing:.3px; }
  header .meta { color:var(--muted-solid); font-size:13px; }
  header .spacer { flex:1; }
  .iconbtn {
    font:inherit; font-size:13px; color:var(--fg); background:var(--panel);
    border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .iconbtn:hover { border-color:var(--accent); color:var(--accent); }
  .layout { display:flex; align-items:stretch; min-height:calc(100% - 53px); }
  aside {
    width:250px; flex:0 0 250px; background:var(--tray); border-right:1px solid var(--border);
    padding:18px 0; overflow-y:auto; position:sticky; top:53px; height:calc(100vh - 53px);
    transition:margin-left .18s ease;
  }
  body.tray-collapsed aside { margin-left:-251px; }
  .fam { padding:6px 20px; margin-top:8px; font-size:11px; font-weight:700;
         letter-spacing:.8px; text-transform:uppercase; color:var(--muted-solid); }
  aside a {
    display:block; padding:6px 20px 6px 28px; color:var(--fg); text-decoration:none; font-size:13.5px;
    border-left:2px solid transparent;
  }
  aside a:hover { color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); }
  aside a.active { color:var(--accent); border-left-color:var(--accent);
                   background:color-mix(in srgb, var(--accent) 10%, transparent); }
  main { flex:1; min-width:0; max-width:1000px; margin:0 auto; padding:26px 32px 90px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
          padding:20px 22px; margin:0 0 24px; scroll-margin-top:70px; }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .card .desc { color:var(--muted-solid); font-size:13px; margin:0 0 16px; max-width:72ch; }
  .chart { width:100%; }
  .chart-static svg { max-width:100%; height:auto; }
  .kv { display:flex; gap:26px; flex-wrap:wrap; }
  .kv .item { min-width:120px; }
  .kv .val { font-size:28px; font-weight:650; }
  .kv .lab { color:var(--muted-solid); font-size:12.5px; margin-top:2px; }
  table.detk { border-collapse:collapse; width:100%; font-size:13px; }
  table.detk th, table.detk td { border:1px solid var(--border); padding:5px 9px; text-align:left; }
  table.detk th { background:var(--bg); }
  .tools { margin-top:12px; }
  .tools button { font:inherit; font-size:12px; color:var(--muted-solid); background:transparent;
                  border:1px solid var(--border); border-radius:6px; padding:3px 10px; cursor:pointer; }
  .tools button:hover { border-color:var(--accent); color:var(--accent); }
  pre.data { display:none; margin-top:12px; max-height:320px; overflow:auto; background:var(--bg);
             border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12px; color:var(--muted-solid); }
  footer { color:var(--muted-solid); font-size:12px; padding:0 32px 40px; text-align:center; }
  .vega-embed .vega-actions a { color:var(--fg) !important; }
  .vega-embed summary { border-color:var(--border) !important; }
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="tray-toggle" title="Toggle navigation" aria-label="Toggle navigation">☰</button>
  <h1>detk report</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button class="iconbtn" id="theme-toggle" title="Toggle light/dark"><span id="theme-icon">🌙</span><span id="theme-label">Dark</span></button>
</header>
<div class="layout">
  <aside id="nav"></aside>
  <main id="main"></main>
</div>
<footer>Generated by <code>detk-report</code> · self-contained · offline · data embedded for provenance</footer>

<!-- vendored, no-build charting libraries (inlined) -->
<script>{{ vega_js|safe }}</script>
<script>{{ vegalite_js|safe }}</script>
<script>{{ vegaembed_js|safe }}</script>

<!-- embedded report payload -->
{# |safe is correct only because report.script_json escapes <, > and & in the
   payload, so no string in it can end these script elements (#46) #}
<script type="application/json" id="detk-modules">{{ modules_json|safe }}</script>
<script type="application/json" id="detk-raw">{{ raw_json|safe }}</script>

<script>
(function () {
  var modules = JSON.parse(document.getElementById("detk-modules").textContent);
  var raw = JSON.parse(document.getElementById("detk-raw").textContent);
  var root = document.documentElement;

  // ---- theme -------------------------------------------------------------
  function prefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  var stored = null;
  try { stored = localStorage.getItem("detk-theme"); } catch (e) {}
  var isDark = stored ? stored === "dark" : prefersDark();

  function vegaConfig() {
    var fg = isDark ? "#e6edf3" : "#1c2733";
    var grid = isDark ? "#263140" : "#e3e6ea";
    return {
      background: "transparent",
      axis: { labelColor: fg, titleColor: fg, gridColor: grid, domainColor: grid, tickColor: grid },
      legend: { labelColor: fg, titleColor: fg },
      title: { color: fg },
      view: { stroke: "transparent" },
      range: { category: ["#4c78a8","#f58518","#54a24b","#e45756","#72b7b2","#b279a2","#ff9da6"] }
    };
  }
  function applyTheme() {
    root.setAttribute("data-theme", isDark ? "dark" : "light");
    document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
    document.getElementById("theme-label").textContent = isDark ? "Light" : "Dark";
  }

  // ---- render ------------------------------------------------------------
  var nav = document.getElementById("nav");
  var main = document.getElementById("main");
  var vegaCharts = [];   // {id, spec}
  var families = {};

  document.getElementById("meta").textContent =
    modules.length + " module" + (modules.length === 1 ? "" : "s");

  modules.forEach(function (m, i) {
    (families[m.family] = families[m.family] || []).push(m);
  });

  // Every descriptor text field (title, desc, note, kv labels and values,
  // table cells, error) and every module name or id is user data or may
  // carry it, so it is set as text, never parsed as markup (#65, DETK-0022).
  // The one exception is v.svg, the server-rendered static chart.
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  // a module id as a safe, unique fragment: letters, digits and "-" stay,
  // any other UTF-16 code unit (including "_") becomes _<hex>_
  function domId(id) {
    return String(id).replace(/[^A-Za-z0-9-]/g, function (c) {
      return "_" + c.charCodeAt(0).toString(16) + "_";
    });
  }

  Object.keys(families).forEach(function (fam) {
    nav.appendChild(el("div", "fam", fam));
    families[fam].forEach(function (m) {
      var cardId = domId(m.id);
      var a = el("a", null, m.title);
      a.setAttribute("href", "#" + cardId);
      a.dataset.target = cardId;
      nav.appendChild(a);

      var card = el("section", "card");
      card.id = cardId;
      card.appendChild(el("h2", null, m.title));
      if (m.desc) card.appendChild(el("p", "desc", m.desc));
      renderView(m, cardId).forEach(function (n) { card.appendChild(n); });
      var tools = el("div", "tools");
      var btn = el("button", null, "Show data (" + m.module + ".json)");
      btn.setAttribute("data-mod", m.id);
      tools.appendChild(btn);
      card.appendChild(tools);
      card.appendChild(el("pre", "data"));
      main.appendChild(card);
    });
  });

  // the view's nodes, in order
  function renderView(m, cardId) {
    var v = m.view || { type: "raw" };
    var out = [];
    if (v.type === "vega") {
      if (v.note) out.push(el("p", "desc", v.note));
      var vis = el("div", "chart");
      // "_vis", not "-vis": every domId output holds an even number of "_"
      // (each one opens or closes an _<hex>_ escape), so an id ending in one
      // more "_" can never equal a card id (#65)
      vis.id = cardId + "_vis";
      vegaCharts.push({ id: vis.id, spec: v.spec });
      out.push(vis);
      return out;
    }
    if (v.type === "svg") {
      if (v.note) out.push(el("p", "desc", v.note));
      var box = el("div", "chart chart-static");
      // the static scatter plot is markup made by report_specs (matplotlib),
      // not user text: the only descriptor field inserted as HTML
      box.innerHTML = v.svg;
      out.push(box);
      return out;
    }
    if (v.type === "kv") {
      if (v.note) out.push(el("p", "desc", v.note));
      var kv = el("div", "kv");
      v.items.forEach(function (it) {
        var item = el("div", "item");
        item.appendChild(el("div", "val", fmt(it.value)));
        item.appendChild(el("div", "lab", it.label));
        kv.appendChild(item);
      });
      out.push(kv);
      return out;
    }
    if (v.type === "table") {
      var table = el("table", "detk");
      var head = el("tr");
      v.columns.forEach(function (c) { head.appendChild(el("th", null, c)); });
      // the same tree the HTML parser built: every row in one tbody
      var tbody = el("tbody");
      tbody.appendChild(head);
      v.rows.forEach(function (r) {
        var tr = el("tr");
        r.forEach(function (c) { tr.appendChild(el("td", null, fmt(c))); });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      out.push(table);
      return out;
    }
    // raw fallback
    if (v.error) out.push(el("p", "desc", "chart error: " + v.error));
    out.push(el("p", "desc", "Raw module data (use “Show data” below)."));
    return out;
  }

  function fmt(x) {
    if (x === null || x === undefined) return "—";
    if (typeof x === "number" && !Number.isInteger(x)) return x.toFixed(3);
    return String(x);
  }

  function embedAll() {
    var cfg = vegaConfig();
    vegaCharts.forEach(function (c) {
      var target = document.getElementById(c.id);
      if (!target) return;
      target.textContent = "";
      vegaEmbed(target, c.spec, {
        // export only. "View Source" and "View Compiled Vega" write
        // the spec's JSON, unescaped, as HTML into a same-origin new window,
        // so a sample or term name in the data would run as script there;
        // "Open in Vega Editor" posts the spec, user data and all, to an
        // outside site. "Show data" shows the module's JSON as text (#65).
        actions: { export: true, source: false, compiled: false, editor: false },
        renderer: "canvas", config: cfg
      }).catch(function (err) { target.textContent = "chart error: " + err; });
    });
  }

  // provenance: reveal raw module JSON
  main.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-mod]");
    if (!btn) return;
    var pre = btn.closest(".card").querySelector("pre.data");
    if (pre.style.display === "block") { pre.style.display = "none"; return; }
    pre.textContent = JSON.stringify(raw[btn.getAttribute("data-mod")], null, 2);
    pre.style.display = "block";
  });

  // nav active-state on scroll + tray toggle
  nav.addEventListener("click", function (ev) {
    var a = ev.target.closest("a"); if (!a) return;
    nav.querySelectorAll("a").forEach(function (x) { x.classList.remove("active"); });
    a.classList.add("active");
  });
  document.getElementById("tray-toggle").addEventListener("click", function () {
    document.body.classList.toggle("tray-collapsed");
  });
  document.getElementById("theme-toggle").addEventListener("click", function () {
    isDark = !isDark;
    try { localStorage.setItem("detk-theme", isDark ? "dark" : "light"); } catch (e) {}
    applyTheme(); embedAll();
  });

  applyTheme();
  embedAll();
})();
</script>
</body>
</html>
