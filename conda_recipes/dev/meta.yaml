package:
  name: de_toolkit
  version: "dev"
  #version: "0.2.3"

source:
  path: ../../
  #git_url: https://bitbucket.org/bubioinformaticshub/de_toolkit
  #git_rev: "0.2.3"

requirements:
  build:
    - python
    - biopython
    - docopt
    - pandas
    - numpy
    - r-docopt
    - rpy2
    - bioconductor-deseq2
    - pytest-runner
    - pytest
    - future
    - git
    - git-lfs
  run:
    - python
    - biopython
    - docopt
    - pandas
    - numpy
    - r-docopt
    - rpy2
    - bioconductor-deseq2
    - pytest
    - future
  test:
    - pytest-runner
    - pytest
    - future

about:
  home: https://bitbucket.org/bubioinformaticshub/de_toolkit
  license: MIT
  license_file: LICENSE

build:
  script: "python setup.py install"
