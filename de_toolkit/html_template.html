<html>
<title>Stats Module Output</title>
<head>
<style>
table, th, td{
        border: 1px solid black;
        border-collapse: collapse;
}
th, td{
        padding: 5px;
        text-align: center;
}
</style>
</head>
<p><center>Stats Module Output</center></p>
</br>
<p $base_hide>Base:
</br>
<table>
  <tr>
    <th>Number of Columns</th>
    <th>Number of Rows</th>
  </tr>
  <tr>
    <td>$num_cols</td>
    <td>$num_rows</td>
  </tr>
</table>
</p>
<p $coldist_hide>Coldist:
$coldist_boxplot
</p>
<p $colzero_hide>Colzero:
 <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script type="text/javascript">
    google.charts.load("current", {packages:['corechart']});
    google.charts.setOnLoadCallback(drawChart);
    function drawChart() {
      var data = google.visualization.arrayToDataTable([$colzero]);

      var options = {
        title: "Proportion of 0 Counts Per Sample",
        width: 600,
        height: 400,
        bar: {groupWidth: "95%"},
        legend: { position: "none" },
        vAxis: {title:"Proportion of 0 Counts"}
      };
      var chart = new google.visualization.ColumnChart(document.getElementById("chart1"));
      chart.draw(data,options);
  }
</script>
<div id="chart1" style="width: 900px; height: 400px;" $colzero_hide></div>
</br>
</p>
<p $rowzero_hide>Rowzero:
</br>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {
        var data = google.visualization.arrayToDataTable([$rowzero_scatter]);

        var options = {
          title: 'Zero Fractions vs. Nonzero Means by Gene',
          hAxis: {title: 'Zero Fraction', minValue: 0, maxValue: 1},
          vAxis: {title: 'Nonzero Mean', minValue: 0},
          legend: 'none'
        };

        var chart = new google.visualization.ScatterChart(document.getElementById('chart2'));

        chart.draw(data, options);
      }
    </script>
<div id="chart2" style="width: 900px; height: 500px;" $rowzero_hide></div>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load("current", {packages:["corechart"]});
      google.charts.setOnLoadCallback(drawChart);
      function drawChart() {
        var data = google.visualization.arrayToDataTable([$rowzero_hist]);

        var options = {
          title: 'Zero Fractions by Gene',
          legend: { position: 'none' },
          colors: ['green'],
	  histogram: { bucketSize: 0.1, minValue: 0.0, maxValue: 1.0}
	};

        var chart = new google.visualization.Histogram(document.getElementById('chart_div3'));
        chart.draw(data, options);
      }
    </script>
<div id="chart_div3" style="width: 1500px; height: 500px;" $rowzero_hide></div>
</p>
<p $entropy_hide>Entropy:
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load("current", {packages:["corechart"]});
      google.charts.setOnLoadCallback(drawChart);
      function drawChart() {
        var data = google.visualization.arrayToDataTable([$entropy]);

        var options = {
          title: 'Entropy Values by Gene',
          legend: { position: 'none' },
          colors: ['red'],
	  histogram: { bucketSize: 0.10}
        };

        var chart = new google.visualization.Histogram(document.getElementById('chart_div4'));
        chart.draw(data, options);
      }
    </script>
<div id="chart_div4" style="width: 900px; height: 500px;" $entropy_hide></div>
</p>
<p $pca_hide>PCA:
</br>
$pca_scree
</br>
$pca_swarm
</p>
</html>
