name: CI

on:
  push:
    branches: [ main, "phase1-tooling" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      # R and Bioconductor are not installed in this job, so the R-backed tests
      # (DESeq2, fgsea, logistf) and the Snakemake report end-to-end test skip
      # automatically. The test-r job below exercises the R integration.
      - name: Run non-R test suite
        run: |
          pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing

  test-r:
    name: test with R (bioconda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install R + Bioconductor packages as prebuilt bioconda binaries, which
      # is far faster than compiling DESeq2/fgsea from source.
      - name: Set up micromamba with R packages
        uses: mamba-org/setup-micromamba@v2
        with:
          condarc: |
            channels:
              - conda-forge
              - bioconda
          environment-name: detk-r
          create-args: >-
            python=3.12
            r-base
            bioconductor-deseq2
            bioconductor-fgsea
            r-logistf

      - name: Install package and test dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run full test suite (including R)
        shell: bash -el {0}
        run: |
          Rscript --version
          pytest tests -o addopts="" -p no:cacheprovider
