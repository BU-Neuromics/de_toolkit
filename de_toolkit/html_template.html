<p $coldist_hide>Coldist:
</br>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load("current", {packages:["corechart"]});
      google.charts.setOnLoadCallback(drawChart);

        function drawChart(){
var array = [$coldist_data];

    var data = new google.visualization.DataTable();
    data.addColumn('string', 'x');
    $coldist_cols
    data.addColumn({ id: 'max', type: 'number', role: 'interval' });
    data.addColumn({ id: 'min', type: 'number', role: 'interval' });
    data.addColumn({ id: 'firstQuartile', type: 'number', role: 'interval' });
    data.addColumn({ id: 'median', type: 'number', role: 'interval' });
    data.addColumn({ id: 'thirdQuartile', type: 'number', role: 'interval' });

    data.addRows(getBoxPlotValues(array));

    /**
     * Takes an array of input data and returns an
     * array of the input data with the box plot
     * interval data appended to each row.
     */
function getBoxPlotValues(array) {

        for (var i = 0; i < array.length; i++) {

            var arr = array[i].slice(1).sort(function (a, b) {
                return a - b;
            });

            var max = arr[arr.length - 1];
            var min = arr[0];
            var median = getMedian(arr);
            var num = array[i].length;
            var index = 0;
            var length = arr.length;

            if(length%2 == 0){
                index = length/2-1;
            }
            else{
                index=Math.floor(length/2);
            }


            // First Quartile is the median from lowest to overall median.
            var firstQuartile = getMedian(arr.slice(0, index));

            // Third Quartile is the median from the overall median to the highest.
            var thirdQuartile = getMedian(arr.slice(index));

            array[i][num] = max;
            array[i][num+1] = min
            array[i][num+2] = firstQuartile;
            array[i][num+3] = median;
            array[i][num+4] = thirdQuartile;
        }
        return array;
    }
/*
     * Takes an array and returns
     * the median value.
     */
    function getMedian(array) {
        var length = array.length;

        /* If the array is an even length the
         * median is the average of the two
         * middle-most values. Otherwise the
         * median is the middle-most value.
         */
        if (length % 2 === 0) {
            var midUpper = length / 2;
            var midLower = midUpper - 1;

            return (array[midUpper] + array[midLower]) / 2;
        } else {
            return array[Math.floor(length / 2)];
        }
    }
//series: [{ 'color': '#D3362D' }],
    var options = {
        title: 'Count Distribution by Column',
        height: 500,
        legend: { position: 'none' },
        vAxis: {title: 'Count'},
        hAxis: {
            gridlines: { color: '#fff' },
            title: 'Sample'
        },
        lineWidth: 0,
        intervals: {
            barWidth: 1,
            boxWidth: 1,
            lineWidth: 2,
            style: 'boxes'
        },
 interval: {
            max: {
                style: 'bars',
                fillOpacity: 1,
                color: 'blue'
            },
            min: {
                style: 'bars',
                fillOpacity: 1,
                color: 'blue'
            },
            firstQuartile: {
                style: 'boxes',
                fillOpacity: 0.7,
                color: 'green'
            },
            thirdQuartile: {
                style: 'boxes',
                fillOpacity: 0.7,
                color: 'red'
            }
        }
    };
   var chart = new google.visualization.LineChart(document.getElementById('box_plot'));

    chart.draw(data, options);
}
</script>
<div id="box_plot" style="width: 900px; height: 500px;" $coldist_hide></div>
</p>
