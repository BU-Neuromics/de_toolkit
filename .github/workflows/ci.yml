name: CI

on:
  push:
    branches: [ main, "phase*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: ruff check
        run: uv run --only-group dev ruff check .

      - name: ruff format check
        run: uv run --only-group dev ruff format --check .

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --dev

      # R and Bioconductor are not installed in this job, so the R-backed tests
      # (DESeq2, fgsea, logistf) skip automatically. The test-r job below
      # exercises the R integration.
      - name: Run non-R test suite
        run: |
          uv run pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing

  test-r:
    name: test with R (bioconda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install R + Bioconductor packages as prebuilt bioconda binaries, which
      # is far faster than compiling DESeq2/fgsea from source.
      - name: Set up micromamba with R packages
        uses: mamba-org/setup-micromamba@v2
        with:
          condarc: |
            channels:
              - conda-forge
              - bioconda
          environment-name: detk-r
          create-args: >-
            python=3.12
            r-base
            r-jsonlite
            r-data.table
            bioconductor-deseq2
            bioconductor-fgsea
            r-logistf

      - name: Install package and test dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run full test suite (including R)
        shell: bash -el {0}
        run: |
          Rscript --version
          pytest tests -o addopts="" -p no:cacheprovider
