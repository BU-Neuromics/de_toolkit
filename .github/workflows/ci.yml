name: CI

on:
  push:
    branches: [ main, "phase*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: ruff check
        run: uv run --only-group dev ruff check .

      - name: ruff format check
        run: uv run --only-group dev ruff format --check .

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build docs
        run: uv run --group docs mkdocs build --strict

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --dev

      # R and Bioconductor are not installed in this job, so the R-backed tests
      # (DESeq2, fgsea, logistf) skip automatically. The test-r job below
      # exercises the R integration.
      - name: Run non-R test suite
        env:
          # unique, combinable data file per matrix job (picked up by the
          # coverage job below via `coverage combine`)
          COVERAGE_FILE: .coverage.py${{ matrix.python-version }}
        run: |
          uv run pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: .coverage.py${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  test-r:
    name: test with R (bioconda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install R + Bioconductor packages as prebuilt bioconda binaries, which
      # is far faster than compiling DESeq2/fgsea from source.
      - name: Set up micromamba with R packages
        uses: mamba-org/setup-micromamba@v2
        with:
          condarc: |
            channels:
              - conda-forge
              - bioconda
          environment-name: detk-r
          create-args: >-
            python=3.12
            r-base
            r-jsonlite
            r-data.table
            bioconductor-deseq2
            bioconductor-fgsea
            r-logistf

      - name: Install package and test dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run full test suite (including R)
        shell: bash -el {0}
        env:
          COVERAGE_FILE: .coverage.r
        run: |
          Rscript --version
          pytest tests -o addopts="" -p no:cacheprovider \
            --cov=de_toolkit --cov-report=term-missing

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-r
          path: .coverage.r
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: combined coverage
    runs-on: ubuntu-latest
    needs: [ test, test-r ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the combine job only needs the coverage CLI, not the project
      - name: Install coverage
        run: python -m pip install coverage

      - name: Download coverage data from all test jobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage across the matrix and R jobs
        run: |
          coverage combine coverage-data
          coverage report

      - name: Write coverage summary
        run: |
          TOTAL=$(coverage report --format=total)
          {
            echo "## Combined coverage: ${TOTAL}%"
            echo
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Floor: local non-R total measured at 71%, rounded down minus a
      # 2-point safety margin. The combined number (with the R job) is
      # higher — ratchet this up to that number after the first CI run.
      - name: Enforce coverage floor
        run: coverage report --fail-under=69
